<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Roboto Mono', monospace; padding: 20px; text-align: center; background: #050505; color: #ccc; }
    h3 { color: #fff4ca; }
    input[type="file"] { margin-top: 20px; cursor: pointer; color: #888; }
  </style>
</head>
<body>
  <h3>Memory Machine Builder</h3>
  <p>Select your <b>figma_payload.json</b> file to generate the deck.</p>
  <input type="file" id="file-input" accept=".json" />
  
  <script>
    document.getElementById('file-input').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const payload = JSON.parse(e.target.result);
        // Send the parsed JSON to code.ts to build the Figma nodes!
        parent.postMessage({ pluginMessage: { type: 'generate-deck', payload: payload } }, '*');
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
